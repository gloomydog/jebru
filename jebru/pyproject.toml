[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jebru"
version = "0.1.0"
description = "JEOL Delta / Bruker TopSpin 1D NMR processing & analysis for Linux (GUI + CLI)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.22",
    "scipy>=1.10",
    "nmrglue>=0.11",
    "matplotlib>=3.5",
    "pyqtgraph>=0.13",
    "PySide6>=6.4",
]

[project.scripts]
jebru-cli = "jebru.cli:main"

[project.gui-scripts]
jebru = "jebru.gui:main"

[tool.setuptools]
packages = ["jebru"]
